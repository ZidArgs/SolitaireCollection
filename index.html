<!DOCTYPE html>
<html>
    <head>
        <title>CardGameCollection</title>
        <meta charset="UTF-8">
        <meta name="description" content="Track items and locations in 'The Legend of Zelda - Ocarina of Time Randomizer' (OOTR)">
        <meta name="robots" content="nofollow">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <meta name="theme-color" content="#cb9c3d">
        <script src="/src/index.js" type="module"></script>
        <style>
            * {
                box-sizing: border-box;
                font-family: Arial;
            }
            body {
                display: flex;
                background: #00aa33;
                width: 100vw;
                height: 100vh;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            body > * {
                flex: 1;
            }
            #main_menu {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                padding: 1vw;
            }
            .game-choice {
                display: inline-block;
                padding: 2vw;
                margin: .5vw;
                border-radius: 2vw;
                box-shadow: inset 0px 0px 0px .5vw #ffffff;
                background-color: transparent;
                border: none;
                -webkit-appearance: none;
                cursor: pointer;
            }
            .game-choice:hover {
                background-color: rgba(255,255,255,0.2);
            }
            .game-choice .game-preview {
                width: 16vw;
                height: 9vw;
                background-repeat: no-repeat;
                background-size: contain;
                background-position: center;
                background-origin: content-box;
                background-color: #ffffff;
                border: solid .2vw #ffffff;
            }
            .game-choice .game-name {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-top: 1vw;
                color: #ffffff;
                font-size: 3vw;
            }
        </style>
    </head>
    <body>
        <div id="main_menu">
            <div class="game-choice" data-game="freecell">
                <div class="game-preview" style="background-image: url('/img/freecell.png');"></div>
                <div class="game-name">Freecell</div>
            </div>
        </div>
        <cgc-freecell id="freecell" style="display: none;"></cgc-freecell>
    </body>
</html>
