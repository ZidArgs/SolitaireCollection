<!DOCTYPE html>
<html>
    <head>
        <title>CardGameCollection</title>
        <meta charset="UTF-8">
        <meta name="description" content="Track items and locations in 'The Legend of Zelda - Ocarina of Time Randomizer' (OOTR)">
        <meta name="robots" content="nofollow">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <meta name="theme-color" content="#cb9c3d">
        <script src="/src/index.js" type="module"></script>
        <style>
            * {
                position: relative;
                box-sizing: border-box;
            }
            body {
                display: flex;
                background: #00aa33;
                width: 100vw;
                height: 100vh;
                padding: 20px;
                margin: 0;
            }
            body > * {
                flex: 1;
            }
            cgc-playingcard > cgc-playingcard {
                top: -.05vw;
            }
            cgc-playingcardplaceholder cgc-playingcard > cgc-playingcard {
                counter-increment: step;
                top: 2.5vw;
            }
        </style>
    </head>
    <body>
        <cgc-freecell id="freecell"></cgc-freecell>
    </body>
</html>
