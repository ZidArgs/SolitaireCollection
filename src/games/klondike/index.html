<!DOCTYPE html>
<html>

<head>
    <title>Klondike</title>
    <meta charset="UTF-8">
    <meta name="description" content="Klondike for the web and mobile">
    <meta name="robots" content="nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <script type="importmap"></script>
    <link rel="stylesheet" href="/games/klondike/index.css">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/favicons/default_192.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/img/favicons/96.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/img/favicons/48.png">
    <link rel="icon" type="image/svg+xml" href="/img/favicons/logo.svg" sizes="any">
    <script src="/games/klondike/index.js" type="module"></script>
    <script type="text/javascript">
        document.write(`<base href="${document.location.origin}" />`);
        window.addEventListener('contextmenu', function () {
            event.preventDefault();
            return false;
        });
    </script>
</head>

<body>
    <div id="playground">
        <div id="top-row">
            <sc-playingcard-stack type="deck" id="deck"></sc-playingcard-stack>
            <sc-playingcard-stack type="drawer" id="drawer"></sc-playingcard-stack>
            <div class="game-buttons">
                <button id="menu_button">MENU</button>
                <button id="undo_button">UNDO</button>
            </div>
            <sc-playingcard-stack type="goal" id="goal_spades" suit="1" image="/image/playing_cards/goals/french/1.png"></sc-playingcard-stack>
            <sc-playingcard-stack type="goal" id="goal_hearts" suit="2" image="/image/playing_cards/goals/french/2.png"></sc-playingcard-stack>
            <sc-playingcard-stack type="goal" id="goal_clubs" suit="3" image="/image/playing_cards/goals/french/3.png"></sc-playingcard-stack>
            <sc-playingcard-stack type="goal" id="goal_diamonds" suit="4" image="/image/playing_cards/goals/french/4.png"></sc-playingcard-stack>
        </div>
        <div id="game-board">
            <sc-playingcard-stack type="column" id="col_0"></sc-playingcard-stack>
            <sc-playingcard-stack type="column" id="col_1"></sc-playingcard-stack>
            <sc-playingcard-stack type="column" id="col_2"></sc-playingcard-stack>
            <sc-playingcard-stack type="column" id="col_3"></sc-playingcard-stack>
            <sc-playingcard-stack type="column" id="col_4"></sc-playingcard-stack>
            <sc-playingcard-stack type="column" id="col_5"></sc-playingcard-stack>
            <sc-playingcard-stack type="column" id="col_6"></sc-playingcard-stack>
        </div>
    </div>
</body>

</html>
